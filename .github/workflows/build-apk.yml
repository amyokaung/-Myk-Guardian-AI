name: Build Myk Guardian AI APK

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The generated Capacitor Android project compiles with Java source level 21.
      # Running Gradle under JDK 17 causes: "error: invalid source release: 21".
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java toolchain
        run: java -version

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Android platform if not committed
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Install native Accessibility plugin
        run: node scripts/setup-android.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myk-guardian-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
