name: Build AMARA AI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust toolchain for Android JNI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Generate Android platform if not committed
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Install native Android integration
        run: npm run android:setup
      - name: Download latest trained Amara wake-word model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow train-burmese-wakeword.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Amara wake-word training run was found." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/amara-wakeword"
          gh run download "$RUN_ID" --name amara-burmese-wakeword-onnx --dir "$RUNNER_TEMP/amara-wakeword"
          MODEL="$(find "$RUNNER_TEMP/amara-wakeword" -type f -name 'amara_ye_burmese.onnx' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "Trained classifier ONNX file was not present in the artifact." >&2
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          cp "$MODEL" android/app/src/main/assets/amara_ye_burmese.onnx
          echo "Bundled trained classifier: $(stat -c%s android/app/src/main/assets/amara_ye_burmese.onnx) bytes"
      - name: Build Rust wake-word JNI library
        run: |
          cd native/wakeword-rs
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs" build --release
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amara-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
