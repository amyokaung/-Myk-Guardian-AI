name: Build AMARA AI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Generate Android platform if not committed
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Install native Android integration
        run: npm run android:setup
      - name: Install Amara ONNX wake-word models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RUN_ID="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/actions/workflows/train-burmese-wakeword.yml/runs?status=success&per_page=20" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n 1)"
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "::error::No successful Amara wake-word training run was found."
            exit 1
          fi
          ARTIFACT_ID="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/actions/runs/${RUN_ID}/artifacts" | jq -r '.artifacts[] | select(.name == "amara-burmese-wakeword-onnx" and .expired == false) | .id' | head -n 1)"
          if [ -z "${ARTIFACT_ID}" ] || [ "${ARTIFACT_ID}" = "null" ]; then
            echo "::error::The latest successful wake-word run has no unexpired ONNX artifact."
            exit 1
          fi
          mkdir -p /tmp/amara-wakeword android/app/src/main/assets/wakeword
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/amara-wakeword/model.zip
          unzip -p /tmp/amara-wakeword/model.zip 'output/amara_ye_burmese/amara_ye_burmese.onnx' > android/app/src/main/assets/wakeword/amara_ye_burmese.onnx
          curl -fsSL https://raw.githubusercontent.com/livekit/livekit-wakeword/main/src/livekit/wakeword/resources/melspectrogram.onnx -o android/app/src/main/assets/wakeword/melspectrogram.onnx
          curl -fsSL https://raw.githubusercontent.com/livekit/livekit-wakeword/main/src/livekit/wakeword/resources/embedding_model.onnx -o android/app/src/main/assets/wakeword/embedding_model.onnx
          test -s android/app/src/main/assets/wakeword/amara_ye_burmese.onnx
          test -s android/app/src/main/assets/wakeword/melspectrogram.onnx
          test -s android/app/src/main/assets/wakeword/embedding_model.onnx
          echo "Wake-word classifier and both training-compatible feature models installed."
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amara-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
