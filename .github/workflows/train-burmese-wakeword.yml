name: Train Burmese Amara Wake Word

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-burmese-wakeword:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 sox portaudio19-dev

      - name: Install LiveKit WakeWord with Burmese TTS backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "livekit-wakeword[train,eval,export,voxcpm]"
          livekit-wakeword --help

      - name: Prepare model and datasets
        run: livekit-wakeword setup --config wakeword/amara_burmese.yaml

      - name: Generate, train, export ONNX, and evaluate
        run: livekit-wakeword run wakeword/amara_burmese.yaml

      - name: Upload ONNX model and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amara-burmese-wakeword-onnx
          path: |
            output/**/*.onnx
            output/**
            data/**/metrics*.json
          if-no-files-found: warn
          retention-days: 14
