name: Train Burmese Amara Wake Word

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-burmese-wakeword.yml"
      - "wakeword/amara_burmese.yaml"

permissions:
  contents: read

jobs:
  train-burmese-wakeword:
    # CPU runner validates the pipeline; full VoxCPM training can be slow.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 sox portaudio19-dev

      - name: Install compatible LiveKit WakeWord release with Burmese TTS backend
        run: |
          python -m pip install --upgrade pip
          # 0.3.0 introduced an extraction API mismatch in the previous run:
          # CLI calls run_extraction(config), but the installed function required sess_options.
          # Pin to the prior release while the upstream API mismatch is resolved.
          python -m pip install "livekit-wakeword[train,eval,export,voxcpm]==0.2.3"
          python -c "import importlib.metadata as m; print('livekit-wakeword', m.version('livekit-wakeword'))"
          livekit-wakeword --help

      - name: Prepare model and datasets
        run: livekit-wakeword setup --config wakeword/amara_burmese.yaml

      - name: Generate, train, export ONNX, and evaluate
        run: livekit-wakeword run wakeword/amara_burmese.yaml

      - name: Upload ONNX model and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amara-burmese-wakeword-onnx
          path: |
            output/**/*.onnx
            output/**
            data/**/metrics*.json
          if-no-files-found: warn
          retention-days: 14
